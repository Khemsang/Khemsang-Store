<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testHealth()">Test /api/health</button>
    <button onclick="testLogin()">Test /api/auth/login</button>
    <pre id="result"></pre>

    <script>
        const API_URL = 'http://localhost:5000';
        
        async function testHealth() {
            try {
                const response = await fetch(`${API_URL}/api/health`, {
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('result').textContent = 
                    `Health Check:\nStatus: ${response.status}\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                document.getElementById('result').textContent = 
                    `Health Check Error:\n${error.message}`;
            }
        }

        async function testLogin() {
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test123'
                    })
                });
                const data = await response.json();
                document.getElementById('result').textContent = 
                    `Login Test:\nStatus: ${response.status}\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                document.getElementById('result').textContent = 
                    `Login Test Error:\n${error.message}`;
            }
        }
    </script>
</body>
</html>
