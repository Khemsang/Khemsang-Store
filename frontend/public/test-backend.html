<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testHealth()">Test Health Endpoint</button>
    <button onclick="testLogin()">Test Login Endpoint</button>
    <pre id="result"></pre>

    <script>
        const API_URL = 'http://localhost:5000';
        
        async function testHealth() {
            try {
                const response = await fetch(`${API_URL}/api/health`, {
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('result').textContent = 
                    `✅ Health Check:\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                document.getElementById('result').textContent = 
                    `❌ Health Check Error:\n${error.message}`;
            }
        }

        async function testLogin() {
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'Test123!'
                    })
                });
                const data = await response.json();
                document.getElementById('result').textContent = 
                    `${response.ok ? '✅' : '❌'} Login Test:\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                document.getElementById('result').textContent = 
                    `❌ Login Test Error:\n${error.message}`;
            }
        }
    </script>
</body>
</html>
